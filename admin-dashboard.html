<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex lg:flex-row flex-col relative"> 
  <!-- sidebar -->
  <section id="menu" class="fixed inset-y-0 left-0 z-40 w-64 bg-black text-gray-400 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform "> 
  <div class="w-full"> 
    <div class="p-3 flex items-center justify-between text-white border-b border-gray-900 overflow-clip z-40"> 
      <div class="flex items-center justify-between w-full"> 
        <div class="flex items-center space-x-3">
          <img src="img/phone.png" class="w-10"> 
          <span class="font-bold text-xl">MobileShop</span> 
        </div>
        <button onclick="toggleSidebar()" class="text-xl text-gray-400 hover:text-white lg:hidden"> 
          ✕
        </button> 
      </div> 
    </div>
    <a href="#" class="flex items-center space-x-2 px-4 py-2 rounded-xl hover:bg-gray-800 transition-colors">
        <span class="text-lg">MANAGEMENT</span>
      </a>
    <div class="p-3 space-y-1 mt-4">
      <a href="#" class="flex items-center space-x-2 px-4 py-3 rounded-xl bg-purple-600 text-white font-medium">
        <span class="text-lg">Dashboard</span>
      </a>
      <a href="#" class="flex items-center space-x-2 px-3 py-3 rounded-xl hover:bg-gray-800 transition-colors">
        <span class="text-lg">Products</span>
      </a>
      <a href="#" class="flex items-center space-x-2 px-3 py-3 rounded-xl hover:bg-gray-800 transition-colors">
        <span class="text-lg">Orders</span>
      </a>
      <a href="#" class="flex items-center space-x-2 px-3 py-3 rounded-xl hover:bg-gray-800 transition-colors">
        <span class="text-lg">Users</span>
      </a>
    </div>
  </div>

  <div class="p-4 border-t border-gray-900">
    <button class="w-full flex items-center justify-center space-x-2 px-4 py-2 rounded-xl bg-gray-900 hover:bg-gray-800 text-white font-medium transition-colors">
      Logout
    </button>
  </div>

  </section>

  <section class="flex-1 flex flex-col min-h-screen lg:pl-64 w-full overflow-x-hidden">
  <header class="w-full mb-6 bg-white px-6 py-4 flex items-center justify-between border-b border-gray-200"> 
      <div class="flex items-center space-x-4"> 
        <button onclick="toggleSidebar()" class="text-3xl text-black md:hidden">☰</button> 
        <h1 class="text-xl lg:text-3xl font-bold text-gray-800">Dashboard</h1> 
      </div> 
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 mx-2 "> 
      <div class="bg-white p-4 rounded-2xl border border-gray-200 flex items-center space-x-4">
        <div class="p-3 bg-green-100 rounded-xl">
          💲
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-400">Total Sales</p>
          <p class="text-2xl font-bold text-gray-800 ">$0.00</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-gray-200 flex items-center space-x-4">
        <div class="p-3 bg-blue-100 rounded-xl">
        🛒
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-400">Total Orders</p>
          <p class="text-2xl font-bold text-gray-800 ">0</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-gray-200 flex items-center space-x-4">
        <div class="p-3 bg-purple-100 rounded-xl">
        👥
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-400">Customers</p>
          <p class="text-2xl font-bold text-gray-800 ">1</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-gray-200 flex items-center space-x-4">
        <div class="p-3 bg-red-100 rounded-xl">
        ⚠️
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-400">Low Stock Items</p>
          <p class="text-2xl font-bold text-gray-800 ">0</p>
        </div>
      </div>
    </div>

    
   <div class=" mb-6 mx-2 bg-white rounded-2xl border border-gray-200 overflow-hidden">
  <div class="p-6 flex justify-between items-center border-b border-gray-100">
    <h3 class="font-bold text-gray-800 text-base">Recent Orders</h3>
    <a class="text-purple-600 font-semibold text-sm cursor-default">View all >></a>
  </div>

  <div class="w-full overflow-x-auto pb-2">
    <table class="w-full text-left min-w-[600px]">
      <thead>
        <tr class="bg-gray-50 text-xs font-bold text-gray-400  border-gray-200">
          <th class="py-4 px-6">ORDER ID</th>
          <th class="py-4 px-6">CUSTOMER</th>
          <th class="py-4 px-6">DATE</th>
          <th class="py-4 px-6">TOTAL</th>
          <th class="py-4 px-6 flex items-center justify-between overflow-y-scroll">
            <span>STATUS</span> 
          </th>
        </tr>
      </thead>
    </table>
  </div>
  </section>

 <script>
  function toggleSidebar() {
    const sidebar = document.getElementById('menu');
    sidebar.classList.toggle('-translate-x-full');
  }
</script>

</body>
</html>
