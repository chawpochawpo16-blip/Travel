<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 flex items-center justify-center min-h-screen p-4 overflow-hidden">
    <section class="w-full max-w-[400px] bg-white rounded-3xl p-6 sm:p-8 flex flex-col items-center"> 
        <img src="img/lock.png" class="bg-gray-200 w-14 m-auto border-gray-400 rounded-2xl">
        <h2 class="font-extrabold text-3xl text-center pt-3">Welcome Back</h2>
        <p class="text-center text-gray-600 font-medium pt-2">Enter your credentials to access your account</p>
        
        <div class="w-full flex flex-col items-start space-y-2">
         <label class="text-sm font-bold text-gray-800 pt-10">Email Address</label>
        <input type="email" placeholder="name@company.com" class="w-full min-[w-52] h-11 border border-gray-400 rounded-xl px-4 py-2 text-sm bg-gray-100 pt-2">
        </div>

        <div class="w-full flex flex-col items-start space-y-2">
        <label class="text-sm font-bold text-gray-800 pt-10">Password</label>
            <input type="password" placeholder="........" class="w-full h-10 border border-gray-400 rounded-xl  px-4 py-2 text-2xl bg-gray-100 font-bold pb-5">
        </div>
        
        <div class="w-full min-[w-430px]:flex items-start space-x-2 pb-3 pt-8">
            <input type="checkbox">
            <label class="text-gray-600">Remember me <a class="text-blue-500 font-bold underline">Forget Password?</a></label>
        </div>

        <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 text-center rounded-2xl transition-colors mt-2">Log In→</button>
        <p class="text-center text-gray-600 font-medium pt-8">Don't have an account yet? <a href="register.html" class="text-blue-500 hover:underline font-bold">Sign up for free
      </a>
        </a></p>

    </section>
    
</body>
</html>
